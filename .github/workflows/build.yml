name: build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # 打 tag 时要创建 Release 并上传 exe

jobs:
  windows:
    name: 构建 Windows 单文件 exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 编译
        run: dotnet build DiskGuard.sln -c Release

      - name: 校验六种界面语言的词条完整性
        run: src\DiskGuard.Cli\bin\Release\net8.0-windows\DiskGuard.Cli.exe i18n

      - name: 采样自检（CLI）
        run: src\DiskGuard.Cli\bin\Release\net8.0-windows\DiskGuard.Cli.exe sample --seconds 3

      - name: 发布单文件 exe
        run: dotnet publish src\DiskGuard.App\DiskGuard.App.csproj -c Release -o dist

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: DiskGuard-win-x64
          path: dist/DiskGuard.exe
          if-no-files-found: error

      # 打 tag（如 v1.3.0）时自动建 Release，把 exe 作为附件挂上去：
      # 普通用户打开 Releases 页面就能直接下载 DiskGuard.exe，不需要编译。
      - name: 创建 Release 并附带 exe
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create $env:GITHUB_REF_NAME dist/DiskGuard.exe --title "磁盘守护 $env:GITHUB_REF_NAME" --generate-notes
